name: Import and verify OL kit images - public sources
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_ol_images_public.py'
      - 'data/ol-archive.json'
      - '.github/workflows/import-public-ol-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Import every FKA catalogue reference from public image search
        run: python scripts/import_ol_images_public.py
      - name: Verify every imported image
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.load(open('data/fka-image-report.json',encoding='utf-8'))
          print(json.dumps(r,indent=2,ensure_ascii=False))
          if r['images_missing'] != 0: raise SystemExit('Missing image references remain')
          bad=[]
          for x in json.load(open('data/fka-images.json',encoding='utf-8')):
              p=pathlib.Path(x['image'])
              if not p.exists() or p.stat().st_size < 3000 or not x.get('width') or not x.get('height'): bad.append(str(p))
          print('BAD_FILES',len(bad))
          if bad: raise SystemExit(1)
          PY
      - name: Commit images and report
        run: |
          git config user.name 'ol-kit-vault-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kits data/fka-images.json data/fka-image-report.json
          git diff --cached --quiet || git commit -m 'Import verified OL kit images from public image sources'
          git push
