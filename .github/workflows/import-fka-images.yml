name: Import OL kit archive images
on:
  push:
    paths:
      - 'scripts/import_fka_images.py'
      - '.github/workflows/import-fka-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Import Football Kit Archive images
        run: python scripts/import_fka_images.py
      - name: Commit local images
        run: |
          git config user.name 'ol-kit-vault-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kits data/fka-images.json
          git diff --cached --quiet || git commit -m 'Import OL kit archive images locally'
          git push
